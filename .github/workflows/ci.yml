name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # PostgreSQL for the audit trail tests (US-19); they are skipped where it is missing.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AUDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.9" pytest pip-audit
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint
        run: ruff check .

      # The same OPA version as policies/opa/Dockerfile. The gateway and acceptance tests
      # start it with the bank's policies, and fail rather than skip without it in CI.
      - name: Set up OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.22.4

      - name: Policy checks
        run: |
          opa fmt --list --fail policies/opa
          opa check --strict policies/opa
          opa test policies/opa -v
          opa test policies/opa --coverage --threshold 100 > /dev/null

      - name: Unit tests
        run: |
          code=0
          pytest -q || code=$?
          # Exit code 5 means no tests exist yet. Allowed only until the first test lands in Sprint 0.
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi

      - name: Dependency audit
        run: |
          for f in $(git ls-files '*requirements*.txt'); do
            echo "Auditing $f"
            pip-audit -r "$f"
          done
