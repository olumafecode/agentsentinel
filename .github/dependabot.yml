version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Add every folder that has its own requirements.txt to this list.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/apps/banking-agent"
      - "/apps/demo-bank-api"
      - "/services/audit-service"
      - "/services/sentinel-gateway"
    schedule:
      interval: "weekly"
    ignore:
      # Ruff stays at 0.16.9, the version in .pre-commit-config.yaml and ci.yml
      - dependency-name: "ruff"
  # Base images in the Dockerfiles, and the PostgreSQL and OPA images in docker-compose.yml
  - package-ecosystem: "docker"
    directories:
      - "/apps/banking-agent"
      - "/apps/demo-bank-api"
      - "/services/audit-service"
      - "/services/sentinel-gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
