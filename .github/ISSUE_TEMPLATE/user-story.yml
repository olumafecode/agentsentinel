name: User story
description: User value with acceptance criteria and requirement links
title: "US-XX "
labels: ["type:story"]
body:
  - type: markdown
    attributes:
      value: After creating the story, add it as a sub-issue of its feature, add its FR, NFR and UC labels, and set Priority, Story points and Sprint on the board.
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a <role>, I want <capability>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One Given, When, Then statement per checkbox. Each one must be testable.
      value: |
        - [ ] Given ..., when ..., then ...
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: input
    id: trace
    attributes:
      label: Traceability
      description: Use cases; functional requirements; non-functional requirements; acceptance tests
      placeholder: "UC-01; FR-02, FR-03; NFR-01; AT-01"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options: ["Must", "Should", "Could", "Won't"]
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Story points
      options: ["1", "2", "3", "5", "8", "13 (split before planning)"]
  - type: textarea
    id: notes
    attributes:
      label: Dependencies and security implications
      placeholder: What must exist first? Which trust boundary does this touch? What could go wrong?
