[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-audit"
version = "0.1.0"
description = "Append-only, hash-linked audit trail in PostgreSQL, with verify-chain and completeness checks"
requires-python = ">=3.12"
# Exact versions are pinned in requirements.txt. sentinel-contracts comes from
# libs/sentinel-contracts in this repository and is installed alongside, never from PyPI.
dependencies = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2", "pydantic>=2.14.4,<3"]

[project.scripts]
sentinel-audit = "sentinel_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_audit = ["migrations/*.sql"]
