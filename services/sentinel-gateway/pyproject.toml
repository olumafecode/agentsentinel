[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-gateway"
version = "0.1.0"
description = "Policy enforcement point: decides on every protected action an agent proposes"
requires-python = ">=3.12"
# Exact versions are pinned in requirements.txt. sentinel-contracts (libs/sentinel-contracts)
# and sentinel-audit (services/audit-service) come from this repository and are installed
# alongside, never from PyPI.
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.16",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30",
]

[project.scripts]
sentinel-gateway = "sentinel_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_gateway = ["data/*.json"]
