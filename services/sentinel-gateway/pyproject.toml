[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-gateway"
version = "0.1.0"
description = "Policy enforcement point: decides on every protected action an agent proposes"
requires-python = ">=3.12"
# Exact versions are pinned in requirements.txt. sentinel-contracts comes from
# libs/sentinel-contracts in this repository and is installed alongside, never from PyPI.
dependencies = ["fastapi>=0.115", "httpx2>=2.16", "pydantic>=2.10,<3", "uvicorn>=0.30"]

[project.scripts]
sentinel-gateway = "sentinel_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_gateway = ["data/*.json"]
