[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-bank-api"
version = "0.1.0"
description = "Synthetic demo bank whose tools Vera asks to use; accepts only gateway-signed calls"
requires-python = ">=3.12"
# Exact versions are pinned in requirements.txt. sentinel-contracts comes from
# libs/sentinel-contracts in this repository and is installed alongside, never from PyPI.
dependencies = ["fastapi>=0.115", "pydantic>=2.10,<3", "uvicorn>=0.30"]

[project.scripts]
demo-bank = "demo_bank_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
