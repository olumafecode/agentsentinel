[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-agent"
version = "0.1.0"
description = "Vera, the banking agent: proposes tool calls only through the Sentinel Gateway"
requires-python = ">=3.12"
# Exact versions are pinned in requirements.txt. sentinel-contracts comes from
# libs/sentinel-contracts in this repository and is installed alongside, never from PyPI.
dependencies = ["httpx2>=2.16", "pydantic>=2.10,<3"]

[project.scripts]
vera = "banking_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
banking_agent = ["data/*.json", "scenarios/*.json"]
